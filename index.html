<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小芒果2025成长轨迹</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #0a0e17;
            color: #e0f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .poster-container {
            width: 100%;
            max-width: 1200px;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 20, 80, 0.6);
        }
        
        /* 星空背景 */
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e1f 0%, #0f1a2f 30%, #1a2f4f 70%, #0f1a2f 100%);
            z-index: 1;
            overflow: hidden;
        }
        
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }
        
        /* 动态轨迹背景 */
        .trail-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            opacity: 0.7;
        }
        
        .trail-line {
            position: absolute;
            height: 3px;
            border-radius: 3px;
            transform-origin: left center;
            filter: blur(1px);
        }
        
        .blue-trail {
            background: linear-gradient(90deg, #2979ff, #4fc3f7);
            box-shadow: 0 0 15px rgba(79, 195, 247, 0.7);
        }
        
        .orange-trail {
            background: linear-gradient(90deg, #ff9100, #ffb74d);
            box-shadow: 0 0 15px rgba(255, 145, 0, 0.7);
        }
        
        /* 海报内容 */
        .poster-content {
            position: relative;
            z-index: 10;
            padding: 40px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* 头部区域 */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(79, 195, 247, 0.3);
            position: relative;
        }
        
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, #2979ff, #ff9100);
            border-radius: 3px;
        }
        
        .title {
            font-size: 3.2rem;
            background: linear-gradient(90deg, #4fc3f7, #ffb74d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 1.5rem;
            color: #bbdefb;
            margin-bottom: 15px;
            font-weight: 300;
        }
        
        .year-tag {
            display: inline-block;
            background: linear-gradient(90deg, #1a237e, #283593);
            color: #e3f2fd;
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 1.2rem;
            letter-spacing: 3px;
            box-shadow: 0 5px 15px rgba(26, 35, 126, 0.5);
            margin-top: 10px;
        }
        
        /* 主体内容布局 */
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            margin-bottom: 40px;
        }
        
        /* 时间轴区域 */
        .timeline-section {
            flex: 1;
            min-width: 300px;
        }
        
        .section-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            padding-left: 15px;
            border-left: 4px solid #4fc3f7;
            color: #bbdefb;
        }
        
        .timeline {
            position: relative;
            padding-left: 30px;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, #2979ff, #ff9100);
            border-radius: 2px;
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(13, 27, 49, 0.7);
            border-radius: 12px;
            border-left: 4px solid #2979ff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .timeline-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .timeline-item.sport {
            border-left-color: #ff9100;
        }
        
        .timeline-date {
            font-size: 0.9rem;
            color: #90caf9;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        
        .timeline-icon {
            margin-right: 8px;
            font-size: 1.1rem;
        }
        
        .timeline-text {
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        .success {
            color: #69f0ae;
        }
        
        .fail {
            color: #ff5252;
        }
        
        .medal {
            margin-left: 10px;
            font-size: 1.2rem;
        }
        
        /* 数据统计区域 */
        .stats-section {
            flex: 1;
            min-width: 300px;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(13, 27, 49, 0.7);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
            border: 1px solid rgba(79, 195, 247, 0.2);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .stat-count {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #4fc3f7, #ffb74d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .stat-label {
            font-size: 1rem;
            color: #bbdefb;
        }
        
        /* 勋章墙 */
        .medals-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 10px;
        }
        
        .medal-item {
            font-size: 2.5rem;
            position: relative;
            transition: transform 0.3s;
        }
        
        .medal-item:hover {
            transform: scale(1.2);
        }
        
        /* 名言区域 */
        .quote-section {
            text-align: center;
            padding: 30px;
            background: rgba(13, 27, 49, 0.5);
            border-radius: 15px;
            margin-top: 30px;
            border: 1px solid rgba(79, 195, 247, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .quote-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #2979ff, #ff9100);
        }
        
        .quote-text {
            font-size: 1.6rem;
            font-style: italic;
            line-height: 1.6;
            color: #e1f5fe;
            margin-bottom: 15px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .quote-author {
            font-size: 1.2rem;
            color: #90caf9;
            letter-spacing: 2px;
        }
        
        /* 动画定义 */
        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        /* 按钮样式 */
        .action-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        
        .action-btn {
            background: linear-gradient(90deg, #2979ff, #4fc3f7);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }
        
        .action-btn.share-btn {
            background: linear-gradient(90deg, #ff4081, #ff9100);
        }
        
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        .action-btn:active {
            transform: translateY(0);
        }
        
        /* 分享菜单 */
        .share-menu {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(13, 27, 49, 0.95);
            border-radius: 15px;
            padding: 20px;
            min-width: 280px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 200;
            border: 1px solid rgba(79, 195, 247, 0.3);
            display: none;
            backdrop-filter: blur(10px);
        }
        
        .share-menu.show {
            display: block;
            animation: slideDown 0.3s ease;
        }
        
        .share-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #bbdefb;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(79, 195, 247, 0.2);
        }
        
        .share-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .share-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(26, 35, 126, 0.3);
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        
        .share-option:hover {
            background: rgba(41, 121, 255, 0.3);
            transform: translateX(5px);
        }
        
        .share-icon {
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(79, 195, 247, 0.2);
        }
        
        .share-text {
            flex: 1;
        }
        
        .share-name {
            font-weight: bold;
            margin-bottom: 3px;
            color: #e3f2fd;
        }
        
        .share-desc {
            font-size: 0.9rem;
            color: #90caf9;
        }
        
        /* 二维码弹窗 */
        .qrcode-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            backdrop-filter: blur(5px);
        }
        
        .qrcode-modal.show {
            opacity: 1;
            visibility: visible;
        }
        
        .qrcode-content {
            background: linear-gradient(135deg, #0a0e1f, #1a2f4f);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 20, 80, 0.7);
            border: 2px solid rgba(79, 195, 247, 0.3);
            position: relative;
        }
        
        .qrcode-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #90caf9;
            font-size: 1.5rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        
        .qrcode-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .qrcode-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #4fc3f7, #ffb74d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .qrcode-image {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            background: white;
            padding: 10px;
            border-radius: 10px;
        }
        
        .qrcode-text {
            margin-top: 20px;
            color: #bbdefb;
            font-size: 1rem;
        }
        
        /* 消息提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(13, 27, 49, 0.95);
            color: #e3f2fd;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(79, 195, 247, 0.3);
            opacity: 0;
            transition: transform 0.4s, opacity 0.4s;
            backdrop-filter: blur(10px);
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        .toast-icon {
            font-size: 1.2rem;
        }
        
        /* 动画 */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .poster-content {
                padding: 20px;
            }
            
            .title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .main-content {
                flex-direction: column;
            }
            
            .stats-container {
                grid-template-columns: 1fr;
            }
            
            .quote-text {
                font-size: 1.3rem;
            }
            
            .action-buttons {
                top: 10px;
                right: 10px;
                flex-direction: column;
            }
            
            .action-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            
            .share-menu {
                top: 120px;
                right: 10px;
                min-width: 250px;
            }
        }
        
        @media (max-width: 480px) {
            .title {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .year-tag {
                font-size: 1rem;
                padding: 6px 15px;
            }
            
            .section-title {
                font-size: 1.5rem;
            }
            
            .timeline-text {
                font-size: 1rem;
            }
            
            .action-buttons {
                position: relative;
                top: 0;
                right: 0;
                flex-direction: row;
                justify-content: center;
                margin-top: 20px;
                margin-bottom: 20px;
            }
            
            .share-menu {
                top: 180px;
                left: 50%;
                transform: translateX(-50%);
                right: auto;
            }
        }
        
        /* 打印样式 */
        @media print {
            body {
                background-color: white;
                padding: 0;
            }
            
            .poster-container {
                box-shadow: none;
                border-radius: 0;
            }
            
            .action-buttons, .share-menu, .qrcode-modal {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <!-- 星空背景 -->
        <div class="stars-bg"></div>
        <div class="stars" id="stars"></div>
        
        <!-- 动态轨迹背景 -->
        <div class="trail-bg" id="trail-bg"></div>
        
        <!-- 海报内容 -->
        <div class="poster-content">
            <!-- 头部区域 -->
            <div class="header">
                <h1 class="title">小芒果 · 2025 成长轨迹</h1>
                <div class="subtitle">代码与汗水交织的进化之路</div>
                <div class="year-tag">CODE × SPORT · 双轨跃迁</div>
            </div>
            
            <!-- 操作按钮 -->
            <div class="action-buttons">
                <button class="action-btn print-btn">
                    <i class="fas fa-print"></i> 打印海报
                </button>
                <button class="action-btn share-btn" id="shareBtn">
                    <i class="fas fa-share-alt"></i> 分享成就
                </button>
            </div>
            
            <!-- 分享菜单 -->
            <div class="share-menu" id="shareMenu">
                <div class="share-title">分享成长轨迹</div>
                <div class="share-options">
                    <div class="share-option" id="copyLinkOption">
                        <div class="share-icon">
                            <i class="fas fa-link"></i>
                        </div>
                        <div class="share-text">
                            <div class="share-name">复制链接</div>
                            <div class="share-desc">复制海报链接分享给好友</div>
                        </div>
                    </div>
                    <div class="share-option" id="saveImageOption">
                        <div class="share-icon">
                            <i class="fas fa-image"></i>
                        </div>
                        <div class="share-text">
                            <div class="share-name">保存为图片</div>
                            <div class="share-desc">将海报保存为高清图片分享</div>
                        </div>
                    </div>
                    <div class="share-option" id="wechatShareOption">
                        <div class="share-icon">
                            <i class="fab fa-weixin"></i>
                        </div>
                        <div class="share-text">
                            <div class="share-name">微信分享</div>
                            <div class="share-desc">生成二维码分享到微信</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 主体内容布局 -->
            <div class="main-content">
                <!-- 时间轴区域 -->
                <div class="timeline-section">
                    <h2 class="section-title">成长里程碑</h2>
                    <div class="timeline" id="timeline">
                        <!-- 时间轴项目将通过JavaScript动态添加 -->
                    </div>
                </div>
                
                <!-- 数据统计区域 -->
                <div class="stats-section">
                    <h2 class="section-title">年度成就统计</h2>
                    <div class="stats-container">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-trophy"></i></div>
                            <div class="stat-count">5</div>
                            <div class="stat-label">奖牌收获</div>
                            <div class="medals-container">
                                <div class="medal-item">🥇</div>
                                <div class="medal-item">🥇</div>
                                <div class="medal-item">🥇</div>
                                <div class="medal-item">🥈</div>
                                <div class="medal-item">🥉</div>
                            </div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-code"></i></div>
                            <div class="stat-count">7</div>
                            <div class="stat-label">编程认证</div>
                            <div class="medals-container">
                                <div class="medal-item pulse">🚀</div>
                                <div class="medal-item">💻</div>
                                <div class="medal-item">⚡</div>
                            </div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-flag"></i></div>
                            <div class="stat-count">16</div>
                            <div class="stat-label">赛事参与</div>
                            <div class="medals-container">
                                <div class="medal-item">🏆</div>
                                <div class="medal-item">🎯</div>
                                <div class="medal-item">🏅</div>
                            </div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-graduation-cap"></i></div>
                            <div class="stat-count">1</div>
                            <div class="stat-label">实验室计划</div>
                            <div class="medals-container">
                                <div class="medal-item pulse">🔬</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-map-signs"></i></div>
                        <div class="stat-count">22/23</div>
                        <div class="stat-label">成就达成率</div>
                        <div class="stat-label">(96% 成功率)</div>
                    </div>
                </div>
            </div>
            
            <!-- 名言区域 -->
            <div class="quote-section">
                <div class="quote-text">"向上成长，是代码与汗水写就的最优算法。每一段轨迹，都是未来闪耀的坐标。"</div>
                <div class="quote-author">—— 小芒果 · 2025 ——</div>
            </div>
        </div>
    </div>
    
    <!-- 二维码弹窗 -->
    <div class="qrcode-modal" id="qrcodeModal">
        <div class="qrcode-content">
            <button class="qrcode-close" id="closeQrcode">
                <i class="fas fa-times"></i>
            </button>
            <div class="qrcode-title">微信分享</div>
            <div class="qrcode-text">使用微信扫描二维码分享此海报</div>
            <div class="qrcode-image" id="qrcodeImage">
                <!-- 二维码将动态生成 -->
                <canvas id="qrcodeCanvas"></canvas>
            </div>
            <div class="qrcode-text">扫描后可在微信中分享给好友或朋友圈</div>
        </div>
    </div>
    
    <!-- 消息提示 -->
    <div class="toast" id="toast">
        <i class="toast-icon fas fa-check-circle"></i>

    <script>
        // 创建星空背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 200;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // 随机大小
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // 随机位置
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // 随机闪烁动画延迟
                star.style.animationDelay = `${Math.random() * 5}s`;
                
                starsContainer.appendChild(star);
            }
        }
        
        // 创建动态轨迹线条
        function createTrailLines() {
            const trailContainer = document.getElementById('trail-bg');
            const lineCount = 15;
            
            for (let i = 0; i < lineCount; i++) {
                const line = document.createElement('div');
                line.classList.add('trail-line');
                
                // 随机选择颜色
                if (Math.random() > 0.5) {
                    line.classList.add('blue-trail');
                } else {
                    line.classList.add('orange-trail');
                }
                
                // 随机位置
                const top = Math.random() * 100;
                const left = Math.random() * 100;
                line.style.top = `${top}%`;
                line.style.left = `${left}%`;
                
                // 随机长度和角度
                const length = Math.random() * 200 + 100;
                const angle = Math.random() * 360;
                line.style.width = `${length}px`;
                line.style.transform = `rotate(${angle}deg)`;
                
                // 随机透明度
                line.style.opacity = Math.random() * 0.5 + 0.2;
                
                trailContainer.appendChild(line);
            }
        }
        
        // 成长数据
        const growthData = [

            { date: "2025年10月18日", text: "深圳市南山区扣叮创意编程-Python(决赛)", result: "一等奖🥇", type: "tech", success: true },

        // 渲染时间轴
        function renderTimeline() {
            const timelineContainer = document.getElementById('timeline');
            
            growthData.forEach(item => {
                const timelineItem = document.createElement('div');
                timelineItem.classList.add('timeline-item');
                
                if (item.type === 'sport') {
                    timelineItem.classList.add('sport');
                }
                
                // 图标
                let iconClass = 'fas fa-code';
                if (item.type === 'sport') {
                    iconClass = 'fas fa-running';
                }
                
                // 结果样式
                let resultClass = 'success';
                if (!item.success) {
                    resultClass = 'fail';
                } else if (item.result.includes('🥇') || item.result.includes('一等奖')) {
                    resultClass = 'success';
                }
                
                timelineItem.innerHTML = `
                    <div class="timeline-date">
                        <i class="timeline-icon ${iconClass}"></i>
                        ${item.date}
                    </div>
                    <div class="timeline-text">
                        ${item.text}：
                        <span class="${resultClass}">
                            ${item.result}
                            ${item.result.includes('🥇') || item.result.includes('🥈') || item.result.includes('🥉') ? '' : ''}
                        </span>
                    </div>
                `;
                
                timelineContainer.appendChild(timelineItem);
            });
        }
        
        // 显示消息提示
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            const toastIcon = toast.querySelector('.toast-icon');
            
            toastText.textContent = message;
            
            if (isSuccess) {
                toastIcon.className = 'toast-icon fas fa-check-circle';
            } else {
                toastIcon.className = 'toast-icon fas fa-exclamation-circle';
            }
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // 复制链接到剪贴板
        function copyLinkToClipboard() {
            const currentUrl = window.location.href;
            
            // 使用现代 Clipboard API
            navigator.clipboard.writeText(currentUrl)
                .then(() => {
                    showToast('链接已复制到剪贴板！');
                })
                .catch(err => {
                    console.error('复制失败:', err);
                    // 备用方法
                    const textArea = document.createElement('textarea');
                    textArea.value = currentUrl;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        showToast('链接已复制到剪贴板！');
                    } catch (err) {
                        showToast('复制失败，请手动复制链接', false);
                    }
                    document.body.removeChild(textArea);
                });
            
            // 关闭分享菜单
            document.getElementById('shareMenu').classList.remove('show');
        }
        
        // 保存海报为图片
        function savePosterAsImage() {
            const posterContainer = document.querySelector('.poster-container');
            
            showToast('正在生成高清图片，请稍候...');
            
            // 使用html2canvas生成图片
            html2canvas(posterContainer, {
                scale: 2, // 提高分辨率
                useCORS: true,
                backgroundColor: '#0a0e17'
            }).then(canvas => {
                // 将canvas转换为图片URL
                const imageUrl = canvas.toDataURL('image/png');
                
                // 创建下载链接
                const link = document.createElement('a');
                link.download = '小芒果2025成长轨迹海报.png';
                link.href = imageUrl;
                
                // 触发下载
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showToast('图片已保存，请查看下载文件夹');
            }).catch(err => {
                console.error('生成图片失败:', err);
                showToast('生成图片失败，请重试', false);
            });
            
            // 关闭分享菜单
            document.getElementById('shareMenu').classList.remove('show');
        }
        
        // 生成二维码
        function generateQRCode() {
            const currentUrl = window.location.href;
            const qrcodeCanvas = document.getElementById('qrcodeCanvas');
            const ctx = qrcodeCanvas.getContext('2d');
            
            // 设置canvas尺寸
            qrcodeCanvas.width = 200;
            qrcodeCanvas.height = 200;
            
            // 清空canvas
            ctx.clearRect(0, 0, qrcodeCanvas.width, qrcodeCanvas.height);
            
            // 生成简单二维码（模拟）
            // 实际应用中，您可以使用专门的二维码库，如qrcode.js
            // 这里我们模拟一个简单的二维码
            
            // 背景
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, 200, 200);
            
            // 三个定位角
            ctx.fillStyle = 'black';
            
            // 左上角
            ctx.fillRect(20, 20, 40, 40);
            ctx.clearRect(30, 30, 20, 20);
            ctx.fillRect(35, 35, 10, 10);
            
            // 右上角
            ctx.fillRect(140, 20, 40, 40);
            ctx.clearRect(150, 30, 20, 20);
            ctx.fillRect(155, 35, 10, 10);
            
            // 左下角
            ctx.fillRect(20, 140, 40, 40);
            ctx.clearRect(30, 150, 20, 20);
            ctx.fillRect(35, 155, 10, 10);
            
            // 添加文字说明
            ctx.fillStyle = 'black';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('小芒果成长轨迹', 100, 190);
            
            // 显示二维码弹窗
            document.getElementById('qrcodeModal').classList.add('show');
            
            // 关闭分享菜单
            document.getElementById('shareMenu').classList.remove('show');
        }
        
        // 初始化事件监听
        function initEventListeners() {
            // 打印按钮
            const printBtn = document.querySelector('.print-btn');
            printBtn.addEventListener('click', () => {
                window.print();
            });
            
            // 分享按钮
            const shareBtn = document.getElementById('shareBtn');
            const shareMenu = document.getElementById('shareMenu');
            
            shareBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                shareMenu.classList.toggle('show');
            });
            
            // 点击页面其他地方关闭分享菜单
            document.addEventListener('click', (e) => {
                if (!shareMenu.contains(e.target) && e.target !== shareBtn) {
                    shareMenu.classList.remove('show');
                }
            });
            
            // 分享选项
            document.getElementById('copyLinkOption').addEventListener('click', copyLinkToClipboard);
            document.getElementById('saveImageOption').addEventListener('click', savePosterAsImage);
            document.getElementById('wechatShareOption').addEventListener('click', generateQRCode);
            
            // 关闭二维码弹窗
            document.getElementById('closeQrcode').addEventListener('click', () => {
                document.getElementById('qrcodeModal').classList.remove('show');
            });
            
            // 点击二维码弹窗背景关闭
            document.getElementById('qrcodeModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('qrcodeModal')) {
                    document.getElementById('qrcodeModal').classList.remove('show');
                }
            });
            
            // 奖牌点击效果
            const medalItems = document.querySelectorAll('.medal-item');
            medalItems.forEach(medal => {
                medal.addEventListener('click', function() {
                    this.style.transform = 'scale(1.5) rotate(15deg)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 300);
                });
            });
            
            // 时间轴项目悬停效果
            const timelineItems = document.querySelectorAll('.timeline-item');
            timelineItems.forEach(item => {
                item.addEventListener('mouseenter', function() {
                    const allItems = document.querySelectorAll('.timeline-item');
                    allItems.forEach(i => {
                        if (i !== this) {
                            i.style.opacity = '0.7';
                        }
                    });
                });
                
                item.addEventListener('mouseleave', function() {
                    const allItems = document.querySelectorAll('.timeline-item');
                    allItems.forEach(i => {
                        i.style.opacity = '1';
                    });
                });
            });
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            createTrailLines();
            renderTimeline();
            initEventListeners();
            
            // 添加一些动态效果
            setInterval(() => {
                const randomTrail = document.querySelectorAll('.trail-line')[Math.floor(Math.random() * 15)];
                if (randomTrail) {
                    randomTrail.style.opacity = Math.random() * 0.7 + 0.3;
                    randomTrail.style.transform = `rotate(${Math.random() * 360}deg)`;
                }
            }, 2000);
            
            // 添加页面加载完成提示
            setTimeout(() => {
                showToast('小芒果2025成长轨迹已加载完成！');
            }, 1000);
        });
    </script>
